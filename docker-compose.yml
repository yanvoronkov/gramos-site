version: '3.8'

services:
  gramos-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gramos_corporate_site
    restart: unless-stopped
    ports:
      # Порт 8080 для прямого доступа или отладки (в Dokploy трафик идет через Traefik)
      - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gramos-site.rule=Host(`gramos.yanvoronkov.ru`)"
      - "traefik.http.routers.gramos-site.entrypoints=websecure"
      - "traefik.http.routers.gramos-site.tls=true"
      - "traefik.http.routers.gramos-site.tls.certresolver=letsencrypt"
      - "traefik.http.services.gramos-site.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
